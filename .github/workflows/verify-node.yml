name: _verify-node (reusable)

# Reusable verification for the npm workspaces. Called by ci-node.yml (on
# push/PR) and by release-npm.yml (before publishing) so the gates are defined
# ONCE and a release only publishes a commit that actually passes them.

on:
  workflow_call:
    inputs:
      ref:
        # The commit to verify when it is not the one that triggered the caller:
        # release-npm.yml's dispatch publishes an EXISTING tag, and the gate must
        # run on the tagged commit, not on `main`. Empty = the triggering commit.
        description: 'Git ref to verify (default: the triggering commit)'
        type: string
        required: false
        default: ''

jobs:
  verify:
    name: verify (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # `timeout-minutes` counts from the moment the job is QUEUED, not from when a
    # runner picks it up. The work here takes 2-6 minutes, so 15 looked generous
    # — until 2026-08-06, when GitHub's hosted queue stalled and both Linux legs
    # were cancelled at exactly 15m01s without ever starting. A cancellation that
    # says nothing about the code is worse than a slow run, so this leaves ~25
    # minutes of queue tolerance while still catching a genuine hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (shared → relay → bridge)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
