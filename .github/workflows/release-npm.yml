name: Release — npm (shared, bridge, relay)

# Publishes one npm package per component tag:
#   shared-v<version>  → @uxnan/shared
#   bridge-v<version>  → uxnan-bridge
#   relay-v<version>   → uxnan-relay
# <version> is the full identifier, e.g. 0.0.1-alpha.20260621.
#
# Dependency order: publish shared FIRST (its own tag). bridge/relay then pin
# @uxnan/shared to the exact `latest` version already on npm before publishing.
#
# Dist-tag: every release publishes to the **`latest`** dist-tag, so the newest
# version is what `npm install` (and the bridge's self-update check) resolves.
# Pre-release channels (`alpha`/`beta`) are NOT set here — add them manually
# after a release when you want one, e.g.
#   npm dist-tag add uxnan-bridge@<version> beta
# (This is intentional: the maintainer opts a build into a channel; `latest`
# always tracks the newest published version.)
#
# Credential: none. Every package publishes through npm **Trusted Publishing**
# (OIDC): the job asks GitHub for an id-token (`permissions: id-token: write`),
# and npm exchanges it for a short-lived publish credential because each
# package's *Trusted Publisher* on npmjs.com names this repository and THIS
# workflow file (`release-npm.yml`). No long-lived token exists to expire —
# which is what stopped the 2026-09-19 cut: `NPM_TOKEN` (a granular token, 90
# days max) ran out the day it was needed, and `npm publish` answered
# `E404 Not Found - PUT …/@uxnan%2fshared`, npm's reply to a token without
# publish rights. Provenance attestations come with it for free.
#
# Requirements this file meets, in case one is "simplified" away:
#   - npm CLI 11.5.1 or newer (the `Upgrade npm` step; the runner's Node 22
#     ships an older npm);
#   - `id-token: write` on the job;
#   - no `NODE_AUTH_TOKEN` / `.npmrc` token — a token would be USED instead of
#     OIDC, and an empty one makes npm fail before it tries the exchange;
#   - `repository.url` in each package.json matching this repository (it does),
#     which provenance verifies;
#   - the trusted publisher registered per package (see docs/releases.md →
#     *npm: Trusted Publishing*). A package whose publisher is missing fails
#     with `ENEEDAUTH` — the fix is on npmjs.com, not here.

on:
  push:
    tags:
      - "shared-v*"
      - "bridge-v*"
      - "relay-v*"
  # Publish an EXISTING tag with THIS workflow file. A tag push runs the
  # workflow as it was at the tagged commit, so re-running a failed publish
  # job cannot pick up a fix made to this file afterwards — which is exactly
  # the situation after a credential change: `shared-v0.0.16-alpha.20260919`
  # was tagged with the token-based version of this file. The tagged commit is
  # what gets built; only the recipe comes from `main`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (shared-v… | bridge-v… | relay-v…)'
        type: string
        required: true

permissions:
  contents: read
  id-token: write # enables npm provenance / future Trusted Publishing

jobs:
  # Verify the exact tagged commit first; publish only if it is green.
  verify:
    uses: ./.github/workflows/verify-node.yml
    with:
      # On a dispatch, verify the tag being published, not `main`.
      ref: ${{ inputs.tag || '' }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm 11.5.1+; Node 22's bundled npm is older.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve package + version from tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # e.g. bridge-v0.0.1-alpha.20260621 — from the push, or the dispatch input
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::'$TAG' is not a tag"; exit 1; }
          PREFIX="${TAG%%-v*}"            # shared | bridge | relay
          VERSION="${TAG#*-v}"            # 0.0.1-alpha.20260621
          case "$PREFIX" in
            shared) WS="shared" ;;
            bridge) WS="bridge" ;;
            relay)  WS="relay" ;;
            *) echo "::error::unknown tag prefix '$PREFIX' (expected shared|bridge|relay)"; exit 1 ;;
          esac
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing workspace '$WS' at version '$VERSION'"

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        # `--allow-same-version` so the workspace's package.json can already carry
        # the release version (source tracks the tag, like mobile's pubspec) without
        # failing here; if it lags (still at the base) this bumps it to the tag.
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version -w ${{ steps.meta.outputs.ws }}

      - name: Pin @uxnan/shared (bridge/relay only)
        if: steps.meta.outputs.ws != 'shared'
        run: |
          SHARED_VER=$(npm view @uxnan/shared dist-tags.latest 2>/dev/null || true)
          if [ -z "$SHARED_VER" ]; then
            echo "::error::@uxnan/shared@latest is not on npm yet. Publish it first (push a shared-v* tag)."
            exit 1
          fi
          npm pkg set "dependencies.@uxnan/shared=$SHARED_VER" -w ${{ steps.meta.outputs.ws }}
          echo "Pinned @uxnan/shared to exact $SHARED_VER"

      - name: Build (all workspaces, dependency order)
        run: npm run build

      # No token: npm detects the Actions OIDC environment and exchanges the
      # id-token for a publish credential scoped to this package and version.
      - name: Publish to npm (latest tag, Trusted Publishing)
        run: npm publish -w ${{ steps.meta.outputs.ws }} --tag latest --access public
