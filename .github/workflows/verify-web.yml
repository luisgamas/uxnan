name: _verify-web (reusable)

# Reusable verification for the marketing site (`web/`). Kept separate from the
# npm-workspace gates because the site is a standalone package: it is NOT part of
# the root `workspaces` array and installs its own dependencies.

on:
  workflow_call:

defaults:
  run:
    working-directory: web

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Queue time counts against this — see the note in `verify-node.yml`, where a
    # stalled hosted queue cancelled two legs at 15m01s without starting them.
    # The build itself takes about two minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The same command Cloudflare Pages runs; it must produce `web/out/`.
      - name: Build the static export
        # The hero's star / download counters are read from the GitHub API at
        # build time; the token only lifts the anonymous rate limit, and the
        # build degrades to hiding them if the call fails.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Assert the export landed
        run: test -f out/index.html
