name: CI — Desktop (uxnandesktop · Tauri 2)

# Runs the reusable desktop verification on every PR and on push to main.
# A failed PR run posts a sticky comment with the failing run link (no AI).
#
# The push that merges a release bump pull request (`release/…`, opened and
# merged by release.yml) is NOT re-verified here: that exact commit already
# passed this workflow on its pull request, and every release workflow verifies
# it again before publishing from its tag. Running it a third time on `main`
# checked nothing new. Every other push to main, and every PR, runs as before.

on:
  push:
    branches: [main]
    paths:
      - "uxnandesktop/**"
      - ".github/workflows/ci-desktop.yml"
      - ".github/workflows/verify-desktop.yml"
      - ".github/workflows/release-desktop.yml"
  pull_request:
    paths:
      - "uxnandesktop/**"
      - ".github/workflows/ci-desktop.yml"
      - ".github/workflows/verify-desktop.yml"
      - ".github/workflows/release-desktop.yml"
  # On demand, for a branch that has no pull request yet: a multi-phase branch
  # is verified on the platform matrix per phase, not only once it is proposed
  # for merge (`gh workflow run ci-desktop.yml --ref <branch>`).
  workflow_dispatch:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/release/')) }}
    uses: ./.github/workflows/verify-desktop.yml
    # CI also verifies the EXPERIMENTAL macOS build on Apple Silicon (macos-14),
    # so a Mac-only regression surfaces on the PR. One mac leg is enough — the code
    # paths are identical across architectures, and GitHub's Intel (macos-13)
    # runners are being retired / queue unpredictably, so the Intel DMG is
    # cross-compiled in the release rather than verified on its own runner. The
    # release workflow keeps its gate on the default Linux + Windows pair.
    with:
      os-list: '["ubuntu-latest", "windows-latest", "macos-14"]'

  # The remote-hosts feature is driven by a real `sshd` in a container, on Linux.
  # Every other live SSH test runs against the `sshd` of the machine doing the
  # testing — which for this project has always been Windows — so the POSIX
  # branches of `shellkind`, of the inventory probe and of the remote git script
  # had never actually executed anywhere. Ubuntu runners ship Docker, so this
  # costs one short job and turns "it works on any OS" into something checked.
  linux-ssh-host:
    name: live SSH against a Linux host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only when the SSH layer or its fixture changed: the suite needs a container
    # build, and paying for it on an unrelated UI change would teach people to
    # ignore it.
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/release/'))
    steps:
      # Full history: the gate below compares against the base commit, and a
      # shallow clone does not have it. Without this the comparison failed with
      # `fatal: bad object`, the gate took its "no" branch, and the job reported
      # **success in five seconds having run nothing** — a green check that had
      # checked nothing, which is worse than no check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Are the SSH layer or its fixture in this change?
        id: touched
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # If the base cannot be resolved, **run**. A gate that cannot tell
          # whether it is needed must err towards testing: skipping is the
          # answer that hides a regression behind a green tick.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "the base commit is not available; running the suite anyway"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" '${{ github.sha }}'              | grep -Eq '^uxnandesktop/(src-tauri/src/ssh/|docker/ssh-test-host/|scripts/(ssh-test-host|run-linux-ssh-tests)\.mjs)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.touched.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.touched.outputs.run == 'true'
        with:
          workspaces: uxnandesktop/src-tauri
      # The Tauri crate needs the same system libraries the verify workflow
      # installs; without them `cargo test` cannot even link.
      - name: System dependencies
        if: steps.touched.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Bring up the Linux SSH host and run the live suite
        if: steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop
        run: npm run test:ssh:linux
      - name: What the host said, if it failed
        if: failure() && steps.touched.outputs.run == 'true'
        run: docker logs uxnan-ssh-test-host || true
      - name: Stop the host
        if: always() && steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop
        run: npm run ssh:host:down || true

  # The installers, built the way the release builds them and then USED: the
  # verify legs above compile and test, but never bundle, so a change to the
  # bundling toolchain (the Tauri CLI, `tauri.conf.json`, the AppImage script)
  # would otherwise meet its first installer on a release tag. Per platform:
  #   Linux   — every package; the AppImage checked and launched the way the
  #             AppImage catalog tests it (`scripts/linux-appimage.sh`), on the
  #             release's own runner image.
  #   Windows — NSIS installed, the app opened, then the installer run AGAIN
  #             over the open app, which is what the in-app updater does; the
  #             MSI installed with its sidecar.
  #   macOS   — the ad-hoc signature, the DMG, the updater archive, a launch.
  # Every leg signs the updater artifacts with a throwaway key, so the `.sig`
  # path runs too. Costs a full bundle per OS, so it runs only when something
  # that shapes an installer changed — or on demand.
  bundle:
    name: installers (${{ matrix.os }})
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/release/')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      # Full history, for the same reason as `linux-ssh-host` above: a gate
      # that cannot see the base must run, not skip.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does this change shape an installer?
        id: touched
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The bundle configuration, the packaging script, the two workflows
          # that bundle — or a new Tauri CLI, which IS the bundler.
          if git diff --name-only "$base" '${{ github.sha }}' \
               | grep -Eq '^(uxnandesktop/src-tauri/(tauri(\.[a-z]+)?\.conf\.json|linux/)|uxnandesktop/scripts/linux-appimage\.sh|\.github/workflows/(release|ci)-desktop\.yml)' \
             || git diff "$base" '${{ github.sha }}' -- uxnandesktop/package.json uxnandesktop/package-lock.json \
               | grep -Eq '^[-+].*@tauri-apps/cli'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: System dependencies (the release leg's list)
        if: runner.os == 'Linux' && steps.touched.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file \
            firejail xvfb x11-utils desktop-file-utils appstream imagemagick icewm
      - uses: actions/setup-node@v4
        if: steps.touched.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uxnandesktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.touched.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.touched.outputs.run == 'true'
        with:
          workspaces: uxnandesktop/src-tauri
          key: ${{ matrix.os }}-bundle
      - name: Prepare the AppImage tooling
        if: runner.os == 'Linux' && steps.touched.outputs.run == 'true'
        run: bash uxnandesktop/scripts/linux-appimage.sh prepare
      - name: Install frontend deps
        if: steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop
        run: npm ci --no-audit --no-fund
      # Never the release key: a key made for this run, and its public half
      # swapped into the config for this build only, so every `.sig` verifies.
      - name: A throwaway updater key
        if: steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop
        run: |
          npx tauri signer generate --ci -w "$RUNNER_TEMP/updater.key"
          # A file, not inline JSON: on Windows the argument goes through
          # cmd.exe, which would eat the quotes.
          printf '{"plugins":{"updater":{"pubkey":"%s"}}}' "$(cat "$RUNNER_TEMP/updater.key.pub")" > "$RUNNER_TEMP/updater-key.conf.json"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater.key"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
          } >> "$GITHUB_ENV"
      - name: Build the installers
        if: steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop
        run: npm run tauri -- build --config "$RUNNER_TEMP/updater-key.conf.json"
      - name: Every updater artifact is signed
        if: steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop/src-tauri/target/release/bundle
        run: |
          find . -name '*.sig' | sort
          # Arrays, so "Uxnan Desktop" in every file name stays one word. A
          # pattern that matched nothing stays literal and fails the -f test.
          case "$RUNNER_OS" in
            Linux)   built=(appimage/*.AppImage deb/*.deb rpm/*.rpm) ;;
            Windows) built=(nsis/*-setup.exe msi/*.msi) ;;
            macOS)   built=(macos/*.app.tar.gz) ;;
          esac
          for f in "${built[@]}"; do
            [ -f "$f" ] || { echo "::error::nothing was built for $f"; exit 1; }
            [ -s "$f.sig" ] || { echo "::error::$f has no updater signature"; exit 1; }
            echo "signed: $f"
          done

      - name: Check the AppImage
        if: runner.os == 'Linux' && steps.touched.outputs.run == 'true'
        env:
          APPIMAGE_SCREENSHOT: ${{ github.workspace }}/appimage-window.png
        run: |
          dpkg -c uxnandesktop/src-tauri/target/release/bundle/deb/*.deb | grep -q 'usr/share/metainfo/dev.luisgamas.uxnandesktop.appdata.xml' \
            || { echo "::error::the .deb carries no AppStream metadata"; exit 1; }
          bash uxnandesktop/scripts/linux-appimage.sh check uxnandesktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Keep the window it showed
        if: always() && runner.os == 'Linux' && steps.touched.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-window
          path: appimage-window.png
          if-no-files-found: ignore

      # The in-app updater runs the NSIS installer while the app is open, and
      # the installer has to close it first. Since Tauri CLI 2.12 it does so
      # through the Windows Restart Manager instead of killing by process
      # name, so this runs exactly that: install, open, install again.
      - name: Install, open, and install again over the open app (NSIS)
        if: runner.os == 'Windows' && steps.touched.outputs.run == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem uxnandesktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:LOCALAPPDATA 'Uxnan Desktop'
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS install exited $($p.ExitCode)" }
          foreach ($f in 'uxnan-desktop.exe', 'uxnan-cli.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "NSIS did not install $f into $dir" }
          }
          $app = Start-Process (Join-Path $dir 'uxnan-desktop.exe') -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "the installed app exited on its own (code $($app.ExitCode))" }
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing over the open app exited $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (-not $app.HasExited) { throw "the installer left the open app running" }
          if (-not (Test-Path (Join-Path $dir 'uxnan-desktop.exe'))) { throw "the reinstall left no app behind" }
          $p = Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS uninstall exited $($p.ExitCode)" }
          "NSIS: install, reinstall over the open app and uninstall all passed"
      - name: Install and remove the MSI
        if: runner.os == 'Windows' && steps.touched.outputs.run == 'true'
        shell: pwsh
        run: |
          $msi = Get-ChildItem uxnandesktop/src-tauri/target/release/bundle/msi -Filter '*.msi' | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 60; throw "MSI install exited $($p.ExitCode)" }
          # Where it went, from msiexec's own log: the WiX template reuses the
          # folder an earlier install recorded (here, the NSIS step's), so it is
          # not always Program Files.
          $line = Select-String -Path "$env:RUNNER_TEMP\msi-install.log" -Pattern 'Property\(S\): INSTALLDIR = (.+)$' | Select-Object -Last 1
          if (-not $line) { throw "the MSI log names no INSTALLDIR" }
          $dir = $line.Matches[0].Groups[1].Value.Trim()
          "MSI installed into $dir"
          foreach ($f in 'uxnan-desktop.exe', 'uxnan-cli.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-ChildItem $dir -ErrorAction SilentlyContinue; throw "the MSI did not install $f into $dir" }
          }
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "MSI uninstall exited $($p.ExitCode)" }
          "MSI: install with the sidecar and uninstall passed"

      - name: Check the app, the DMG and a launch (macOS)
        if: runner.os == 'macOS' && steps.touched.outputs.run == 'true'
        working-directory: uxnandesktop/src-tauri/target/release/bundle
        run: |
          app="macos/Uxnan Desktop.app"
          [ -x "$app/Contents/MacOS/uxnan-desktop" ] || { echo "::error::no app binary"; exit 1; }
          [ -x "$app/Contents/MacOS/uxnan-cli" ] || { echo "::error::no uxnan-cli sidecar in the app"; exit 1; }
          # Ad-hoc signed (`signingIdentity: "-"`): valid, just not by a Developer ID.
          codesign --verify --deep --strict --verbose=2 "$app"
          dmg=$(find dmg -name '*.dmg' -print -quit)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          [ -d "$RUNNER_TEMP/dmg/Uxnan Desktop.app" ] || { echo "::error::the DMG holds no app"; exit 1; }
          hdiutil detach "$RUNNER_TEMP/dmg"
          "$app/Contents/MacOS/uxnan-desktop" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 20
          kill -0 "$pid" || { cat "$RUNNER_TEMP/app.log"; echo "::error::the app exited on its own"; exit 1; }
          kill "$pid"
          echo "macOS: signature, DMG and launch passed"

  pr-comment-on-failure:
    needs: verify
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment the failure on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-failure-desktop -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### ❌ CI (Desktop) failed',
              'Verification of `uxnandesktop` (svelte-check / vite / cargo fmt·clippy·test) did not pass on `' + context.sha.slice(0, 7) + '`.',
              '',
              '- Failure details: ' + run,
              '- Reproduce locally (in `uxnandesktop/`): `npm ci && npm run check && cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path src-tauri/Cargo.toml`',
              '',
              '_Automated comment; it updates when the result changes._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
