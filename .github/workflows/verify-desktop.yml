name: _verify-desktop (reusable)

# Reusable verification for the desktop app (svelte-check + vite + Rust
# fmt/clippy/test). Called by ci-desktop.yml (push/PR) and release-desktop.yml
# (before building installers).

on:
  workflow_call:
    inputs:
      os-list:
        description: >-
          JSON array of runner labels to verify on. Defaults to the
          release-gating pair (Linux + Windows); CI passes the experimental
          macOS runners too so a Mac regression is caught on PRs without
          blocking the release build.
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest"]'

defaults:
  run:
    working-directory: uxnandesktop

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uxnandesktop/package-lock.json

      - name: Set up Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: uxnandesktop/src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Svelte type-check
        run: npm run check

      # Both Vitest projects: `node` (pure logic, the benchmark harness, the test
      # fixtures) and `dom` (Svelte components in jsdom). Component tests are in
      # the required gate from the start — they are fast, and they catch the
      # mounting and wiring failures that unit tests structurally cannot.
      #
      # End-to-end (L4) is deliberately NOT here: it needs a release binary, a
      # version-matched WebDriver and a machine with no other uxnan running — and
      # it does not pass on a hosted runner at all (the attach never gets a
      # debugging port; the evidence is in `e2e-desktop.yml`'s header). It is a
      # local layer, kept dispatch-only there.
      - name: Frontend unit + component tests (Vitest)
        run: npm test

      - name: Frontend build (Vite)
        run: npm run build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
