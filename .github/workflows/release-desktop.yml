name: Release — Desktop (Tauri installers)

# Builds desktop installers from an explicit channel tag and attaches them to a
# DRAFT GitHub Release, together with the updater artifacts (`.sig` signatures +
# a merged `latest.json`) when the signing secrets are present. The tag is the
# source of truth for the channel, so a stable build cannot accidentally become a
# nightly (or vice versa) by changing a GitHub checkbox after the build:
#   desktop-stable-v0.0.PATCH
#   desktop-nightly-v0.0.PATCH-nightly.YYYYMMDD.N
# Publishing that draft fires `release-desktop-manifest.yml`, which copies
# `latest.json` onto the matching rolling updater release.
#
# Windows ships without OS code-signing for now (SmartScreen warning) — that is a
# SEPARATE, paid certificate, unrelated to the free updater signature below.
# macOS ships as an EXPERIMENTAL, UNSIGNED build: two separate DMGs (Apple Silicon
# aarch64 + Intel x86_64) carrying an ad-hoc signature (tauri.conf.json →
# bundle.macOS, signingIdentity "-" — free, no Apple secrets). It has NO Apple
# Developer ID / notarization, so users clear Gatekeeper by hand (see
# uxnandesktop/docs/install-macos.md). A mac leg failing never blocks the
# win/linux artifacts (fail-fast: false).
#
# FOR-HUMAN: the updater signature needs two repo secrets (free; generate with
# `npx tauri signer generate`). Without them the build still succeeds, just
# without `.sig`/`latest.json`, so the in-app updater can't verify/apply updates:
#   - TAURI_SIGNING_PRIVATE_KEY           (contents of the generated private key)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (its password; empty string if none)
# Also replace `plugins.updater.pubkey` in src-tauri/tauri.conf.json with the
# matching public key. See uxnandesktop/docs/updates.md → "First-time setup".

on:
  push:
    tags:
      - 'desktop-stable-v*'
      - 'desktop-nightly-v*'

permissions:
  contents: write # create/upload the GitHub Release

jobs:
  # Verify the exact tagged commit first; build installers only if it is green.
  verify:
    uses: ./.github/workflows/verify-desktop.yml

  # Refuse to build a release whose announced platform state exceeds the
  # recorded evidence (uxnandesktop/tests/platform-support.json — see
  # uxnandesktop/docs/platform-support.md). Pure Node, no install step: the
  # same rule also runs in the required `npm test` gate on every PR, so this is
  # the belt to that suspender on the tagged commit itself.
  platform-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Announced platform states must not exceed the evidence
        run: node uxnandesktop/scripts/platform-support.mjs gate

  build:
    needs: [verify, platform-gate]
    strategy:
      fail-fast: false # a failing mac leg must not drop the win/linux artifacts
      matrix:
        include:
          - os: ubuntu-latest
            args: ''
            rust-target: ''
          - os: windows-latest
            args: ''
            rust-target: ''
          # EXPERIMENTAL macOS — two separate DMGs, one per architecture, both built
          # on Apple Silicon runners (macos-14). GitHub's Intel (macos-13) runners
          # are being retired and queue unpredictably, so the Intel DMG is
          # cross-compiled to x86_64 (the frontend is arch-agnostic and the Rust
          # deps cross-compile). Bundling only compiles + packages — it never runs
          # the x86_64 binary — so no Rosetta is needed.
          - os: macos-14
            args: '--target aarch64-apple-darwin'
            rust-target: 'aarch64-apple-darwin'
          - os: macos-14
            args: '--target x86_64-apple-darwin'
            rust-target: 'x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # building installers for four targets is the slow case
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uxnandesktop/package-lock.json

      - name: Resolve and validate release channel from tag
        id: meta
        shell: bash
        run: node uxnandesktop/scripts/desktop-release-tag.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }} # the Apple target on mac; empty otherwise

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: uxnandesktop/src-tauri

      - name: Sync version into manifests
        shell: bash
        working-directory: uxnandesktop
        run: |
          V="${{ steps.meta.outputs.version }}"   # stable: 0.0.10; nightly: 0.0.11-nightly.20260712.1
          # The Windows MSI target rejects a non-numeric pre-release identifier
          # (and any number > 65535), so the BUNDLE version is the numeric base
          # only. The full version still names the GitHub Release + tag.
          BASE="${V%%-*}"                          # e.g. 0.0.1
          echo "Bundle version (MSI-safe): $BASE   |   release name: $V"
          # Embed the FULL release name for the app to display (the bundle keeps
          # the numeric base; see updater::app_version). Read at compile time via
          # option_env!("UXNAN_VERSION").
          echo "UXNAN_VERSION=$V" >> "$GITHUB_ENV"
          npm version "$BASE" --no-git-tag-version --allow-same-version
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs');const o=JSON.parse(fs.readFileSync(f,'utf8'));o.version='$BASE';fs.writeFileSync(f,JSON.stringify(o,null,2)+'\n')"
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$BASE"'"/m' src-tauri/Cargo.toml

      - name: Install frontend deps
        working-directory: uxnandesktop
        run: npm ci

      - name: Build installers + draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (free minisign key). When set, tauri-action emits a
          # `.sig` per installer and a merged `latest.json`; when unset it builds
          # the same installers without them. NOT OS code-signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: uxnandesktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Uxnan Desktop ${{ steps.meta.outputs.version }}'
          releaseDraft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          args: ${{ matrix.args }} # per-arch --target on macOS; empty on win/linux

  # The body, and — for nightlies only — the publish.
  #
  # tauri-action leaves the draft with an EMPTY body: the "What's Changed" list
  # you normally see is produced by the "Generate release notes" button at
  # publish time. This writes the same thing from the API, with one correction:
  # the baseline is pinned to the previous desktop build in EITHER channel.
  # Left to choose, GitHub compared a nightly against the previous *nightly* —
  # two weeks and six releases back — and re-listed 9 pull requests that had
  # already shipped. (The "Contributors" block is not part of the body at all;
  # GitHub renders it from the commit range once a release is published.)
  #
  # Nightly publishes itself, which is what fires `release-desktop-manifest.yml`
  # and lets the in-app updater see the build. Stable stays a draft on purpose:
  # "this is now the default download" is a human decision.
  notes:
    needs: build
    # `build` tolerates a macOS leg failing on purpose (fail-fast: false) — the
    # Windows and Linux installers are still worth shipping. `needs:` alone would
    # skip this job in that case, leaving the release with no body and, for a
    # nightly, unpublished. It happened on 0.0.30, where the Intel mac leg built
    # everything and then hit a network timeout uploading it.
    if: always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Publishing with GITHUB_TOKEN creates a `release: published` event that
      # GitHub refuses to act on — the same anti-recursion rule that stops a tag
      # from starting a build. On 0.0.30 the release went public and
      # `release-desktop-manifest.yml` never ran, so the updater kept serving
      # 0.0.29. The app token makes the publish a real event.
      - name: Mint a release token
        id: token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes script reads the tag history

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the channel from the tag
        id: meta
        run: node uxnandesktop/scripts/desktop-release-tag.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Write the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/notes.mjs "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" > notes.md
          echo "--- generated body ---"
          cat notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      # Publishing a nightly whose installers are all missing would be worse than
      # leaving it: the updater would offer a release with nothing to download.
      - name: Refuse to publish an empty release
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"             --json assets --jq '[.assets[] | select(.name | test("\.(msi|exe|dmg|deb|rpm|AppImage)$"))] | length')
          echo "installers=$count" >> "$GITHUB_OUTPUT"
          echo "$count installer(s) attached"
          if [ "$count" = "0" ]; then
            echo "::error::No installers were attached — not publishing."
            exit 1
          fi

      - name: Publish (nightly only)
        if: steps.meta.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          if [ -z "${{ steps.token.outputs.token }}" ]; then
            echo "::warning::Published with GITHUB_TOKEN, so release-desktop-manifest.yml will NOT run and the updater will not see this build. Re-publish it by hand (unpublish, publish) to roll latest.json."
          fi

      - name: Say what is left to a human
        run: |
          if [ "${{ steps.meta.outputs.channel }}" = "stable" ]; then
            echo "::notice::Stable draft is ready with its notes — review the assets and press Publish."
          else
            echo "::notice::Nightly published; release-desktop-manifest.yml will roll latest.json onto the nightly channel."
          fi
