# The desktop app and the two small crates that share its control protocol: the
# protocol itself (`crates/control-protocol`, no Tauri, no async — the contract)
# and the console client (`crates/uxnan-cli`). One lockfile, one toolchain, one
# `cargo test --workspace`. The members take the app's version from here so a
# release bumps all three in the one place the release tooling already edits.
[workspace]
members = ["crates/control-protocol", "crates/uxnan-cli"]
resolver = "2"

[workspace.package]
version = "0.0.57"
authors = ["Luis Donaldo Gamas Vazquez"]
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"

[package]
name = "uxnan-desktop"
version.workspace = true
description = "Uxnan Desktop — Agent Development Environment (ADE)."
authors.workspace = true
edition.workspace = true
# Floor set by `russh` (the SSH client), not by anything in this crate. Raised
# from 1.77.2 deliberately: nothing consumes this as a contract — every workflow
# builds on `stable`, `rust-toolchain.toml` says `stable`, there is no MSRV job
# and this crate is never published — so holding it back would only have meant
# shipping an SSH/crypto stack eight minor versions behind to protect a claim
# nobody verifies.
rust-version.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uxnan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The control protocol (catalog, envelopes, discovery file, selectors) shared with
# `uxnan-cli`, so the app and its console client cannot disagree on a name.
uxnan-control-protocol = { path = "crates/control-protocol" }
# `devtools`: keep web DevTools available in release builds too, so the integrated
# developer browser can debug the pages agents serve.
# `macos-private-api` exists solely for the desktop pet window: a transparent
# webview window needs it on macOS (it is a no-op on Windows/Linux).
# `unstable` is Tauri's multi-webview API (`Window::add_child`): the integrated
# browser's pages are child webviews *inside* the main window, so they move,
# minimize and change desktop with it and never float over other apps. Every
# child webview is created from an `async` command — a synchronous one deadlocks
# WebView2 creation on Windows (see `browser/host.rs`).
tauri = { version = "2", features = ["devtools", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# In-app auto-updater: checks a per-channel `latest.json` manifest on the GitHub
# Releases, downloads the signed installer and applies it. Signature is verified
# against the `pubkey` in `tauri.conf.json` (a free minisign key — unrelated to
# OS code-signing). Download and install are driven as separate steps so the
# download is non-disruptive and the install can wait for agents to go idle
# (see `updater.rs`).
tauri-plugin-updater = "2"
# Persists & restores the main window's size/position/maximized state across
# launches (so the app reopens at the size the user left it). Official Tauri
# plugin; auto-saves on exit and restores on startup.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encodes image blobs as base64 data URLs for the visual image-diff viewer
# (git.rs `image_diff`) and the project/branch icon fetcher (commands.rs
# `image_fetch_data_url`). Pure Rust, tiny, widely used.
base64 = "0.22"
# Pairing QR shown in Settings → Bridge & mobile (pure Rust, MIT/Apache-2.0).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# HTTP client for downloading a project/branch icon from a URL or a git host
# avatar into an inline data URL (commands.rs `image_fetch_data_url`). Doing the
# GET in Rust sidesteps webview CORS/canvas-taint entirely. rustls (no OpenSSL);
# the exact version is already in the tree via tauri-plugin-updater, so this adds
# no new build cost. MIT/Apache-2.0.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `net` + `io-util` are what a port forward is made of: a loopback listener here
# and `copy_bidirectional` between it and the SSH channel (`ssh/forward.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "process", "macros", "net", "io-util"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
sysinfo = "0.33"
# libgit2 bindings for high-frequency status/diff (the 3 s watcher + the review
# panel), avoiding a subprocess per poll. Worktree mgmt / push / pull stay on the
# git CLI (git.rs); git2 is the fast path with a CLI fallback. Vendored libgit2.
git2 = { version = "0.20", default-features = false }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
# WebSocket client for the bridge's loopback local control channel
# (`bridgeclient/`, architecture/02a §5.8.15): the desktop drives the bridge's
# conversations as one more client next to the phone. Plain `ws://127.0.0.1`
# only — default features (`connect` + `handshake`), no TLS stack pulled in.
# MIT, maintained with tungstenite, MSRV 1.85 (this crate's own).
tokio-tungstenite = "0.30"
# Format-preserving TOML editor, used to merge our MCP server entry into an
# agent's `config.toml` (Codex) without clobbering the user's other settings or
# comments. Pure Rust; `serde` handles the JSON-config agents (Claude/Antigravity/…).
toml_edit = "0.22"
# SHA-256 (+ hex encoding) used only to reproduce Codex's per-hook `trusted_hash`
# so the ADE-managed status hook is auto-trusted in `~/.codex/config.toml`
# (Codex 0.129+ gates hooks on this trust). RustCrypto, pure Rust, tiny,
# MIT/Apache-2.0. See `codex_trust.rs`.
sha2 = "0.10"
hex = "0.4"
# Filesystem watcher for the right-panel file tree + the open-file editor: a
# debounced, cross-platform watch of the active worktree root that emits
# `fs:changed` so the UI reflects files created/deleted/edited on disk without a
# manual refresh. `notify` is re-exported by the debouncer; pinned together.
notify = "6"
notify-debouncer-full = "0.3"
# Moves a deleted file/folder to the OS trash (Recycle Bin / Trash / freedesktop)
# instead of unlinking it, so the file-tree "Delete" action is recoverable. Thin,
# cross-platform, pure-Rust API (`trash::delete`); the call is synchronous so it
# runs on the blocking pool (fs.rs `delete_to_trash`).
trash = "5"
# ripgrep's directory walker: powers the file tree's project-wide search
# (fs.rs `search_files`). Respects `.gitignore` / global excludes and can hide
# dotfiles, so a recursive filename search skips `node_modules`/`.git`/ignored
# paths without us re-implementing gitignore semantics. Synchronous → blocking pool.
ignore = "0.4"
# The other two thirds of the file tree's search: `regex` matches file *content*
# (fs.rs `search_content` — literal, whole-word and user regex all compile down to
# one pattern), and `globset` compiles the include/exclude filters both searches
# share. Both are ripgrep's own crates and already in the tree via `ignore`, so
# naming them here adds no build cost. MIT/Apache-2.0.
regex = "1"
globset = "0.4"
# SSH client for remote hosts (`ssh/`). In-process rather than shelling out to
# `ssh` per operation: the Windows OpenSSH client does not implement
# `ControlMaster`, so every invocation would pay a full TCP + auth handshake
# (~400 ms), and one connection carrying many channels is the whole design.
# Pure Rust, Apache-2.0, and its crypto backend (`aws-lc-rs`) is already in the
# tree via rustls/reqwest, so it adds no new build toolchain. It sets this
# crate's MSRV — see `rust-version` above.
russh = "0.62.6"
# SFTP over the same connection. A *subsystem*, not a shell — it behaves
# identically whatever shell a host starts (cmd, PowerShell, WSL, Git Bash) and
# needs nothing installed there, which is why remote files go through it rather
# than through commands typed at a prompt. Apache-2.0, pure Rust, ~54 KiB.
russh-sftp = "2.4.0"
# SHA-1, for exactly one thing: reading OpenSSH's hashed `known_hosts` entries
# (`|1|salt|hmac`), whose lookup keys are HMAC-SHA1 by that file format's own
# definition. Not a security primitive here — the host key itself is compared
# byte-for-byte. Pinned to 0.10 to share `digest` 0.10 with sha2 already in the
# tree; 0.11 pulls a second, incompatible digest generation into the graph.
sha1 = "0.10"

# Windows-only: SetThreadExecutionState for the keep-awake feature (power.rs),
# and GetShortPathNameW for the agent hooks — Grok parses a hook command as a
# literal path with no quoting, so a hooks folder whose path contains a space is
# only reachable through its 8.3 short form (agent_hooks.rs).
# `join_all` for the SFTP requests a folder listing fans out (one `.git` check
# per folder). They pipeline on the session's single channel, which is what
# makes the badge affordable: 63 folders cost 44ms one after another and 3.3ms
# together. Already compiled into this binary via axum/hyper/tokio-util/tauri,
# so making it direct adds nothing to the build. Apache-2.0/MIT.
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
# Wipes the raw bytes of a CLI's stored token once the usage reader has parsed
# them (`credstore::Secret`, `usage.rs`) — a token is only ever in memory for the
# duration of one API call and must not linger in a freed buffer. RustCrypto,
# pure Rust, already in the tree via `russh`; MIT/Apache-2.0.
zeroize = "1"

# The macOS half of `credstore.rs`: reads a token another CLI keeps in the login
# Keychain (Claude Code's `Claude Code-credentials`) through Security.framework,
# with user interaction disabled on the polling path so a poll can never pop an
# OS dialog — access is granted once, explicitly, from Settings → Providers.
# Already in the tree via `rustls-platform-verifier` (reqwest); MIT/Apache-2.0.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# The macOS half of `browser/capture.rs`: a browser page's screenshot through
# WebKit's own `takeSnapshotWithConfiguration:` and AppKit's PNG encoder. The
# same Objective-C bindings the webview itself is built on (wry), at the versions
# already in the tree — only a few more framework classes are compiled in.
# MIT/Apache-2.0/Zlib.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_Power",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# The user's PATH for the `uxnan-cli` shim (`control/cli.rs`); already in the
# tree through the updater, so no new code to trust.
winreg = "0.55"
# The Windows half of `browser/capture.rs`: a browser page's screenshot through
# WebView2's own `CapturePreview` into an in-memory stream. The same WebView2 and
# Windows bindings the webview is built on (wry), at the versions already in the
# tree. MIT/Apache-2.0.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# The Linux half of `browser/capture.rs`: a browser page's screenshot through
# WebKitGTK's `webkit_web_view_get_snapshot`, written as PNG by cairo. Both are
# what the webview is built on (wry), at the versions already in the tree; `png`
# compiles in cairo's own PNG writer. MIT.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
cairo-rs = { version = "0.18", features = ["png"] }
# `keyboard.rs` hears the app's global shortcuts inside a browser page through
# the page's GTK widget. The GTK the webview is built on (wry), at the version
# already in the tree. MIT.
gtk = "0.18"


[dev-dependencies]
tempfile = "3"
# `test`: Tauri's mock app, so the local server and the control surface can be
# exercised end to end (real socket, real auth, real dispatch) without a window.
tauri = { version = "2", features = ["test"] }
# `test-util` enables tokio's paused virtual clock, which is how the resource
# sampler's park/wake behavior is tested without real waits (`resources.rs`).
tokio = { version = "1", features = ["test-util"] }
# The resource-observability integration tests (`tests/resources_processes.rs`)
# read real process facts through the same sysinfo the app uses.
sysinfo = "0.33"
# Only for the live SSH test that opens many channels at once (`ssh/auth.rs`):
# `join_all` over borrowed futures, which tokio::spawn cannot take. Test-only, so
# it never reaches the shipped binary.
futures = "0.3.34"
