[package]
name = "uxnan-cli"
description = "The console client of Uxnan Desktop: operate the running app from any shell — for people, scripts and agents."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "uxnan-cli"
path = "src/main.rs"

[dependencies]
uxnan-control-protocol = { path = "../control-protocol" }
uxnan-control-client = { path = "../control-client" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Argument parsing. `derive` for the declarative command tree; no color/suggest
# features — the output contract is plain text on stdout, errors on stderr.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Decodes a browser page screenshot (`browser screenshot --out`) from the
# base64 the protocol carries it in. Already in the workspace through the app;
# pure Rust, MIT/Apache-2.0.
base64 = "0.22"
